<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>

    <style>
        body{
            font-family: Arial;
            margin-top: 0px;
            margin-bottom: 0px;
        }
        .css-send-button{
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            margin-left: 10px;
            margin-top: 10px;
        
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .css-input{
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 10px;
            align-items: center;
            flex-grow: 1;
        }

        .css-input-container{
            display: flex;
            margin-bottom: 30px;
           
        }
        .css-app-container{
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .css-user-message{
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 10px;
            width: 100%;
        }       
        .css-robot-message{
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-top: 10px;
            width: 100%;
        }
        .chat-message-text{
            background-color: rgb(238,238, 238);
            max-width: 60%;
            padding: 10px;
            border-radius: 8px;
            margin: 0 10px;
        }
        .css-message-icon{
            width:40px;
        }
        .css-chat-messages-container{
            flex-grow: 1;
            margin-top: 20px;
            overflow: scroll;
            scrollbar-width: none;
        }
        .welcome-message{
            text-align: center;
            color: rgb(71, 144, 246);
        }
        .loading-gif{
            height: 40px;
            margin:-15px;
        }
    </style>

  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function useAutoScroll(dependencies){
             const containerref = React.useRef(null);
        React.useEffect(() => {
            const containerElem = containerref.current;
            if(containerElem){
                containerElem.scrollTop = containerElem.scrollHeight;   
            }
        }, dependencies);

        return containerref;
        }
       
        function ChatInput({chatMessages, setChatMessages}){
            const [inputText, setInputText] =  React.useState('');
            function saveInputText(event){
                setInputText(event.target.value);
            }
            async function SendMessage(){

               

                setInputText('');
                const newChatMessages = [...chatMessages, 
                  {
                message: inputText,
                sender: 'user',
                id: crypto.randomUUID()}
               ];
                  setChatMessages([
                    ...newChatMessages,
                {
                    message: <img src="loading-spinner.gif"
                    className="loading-gif"
                    ></img>,
                    sender: 'robot',
                    id: crypto.randomUUID()
                }
            ]);  

              const response =  await Chatbot.getResponseAsync(inputText);
                    setChatMessages([...newChatMessages, 
                  {
                message: response,
                sender: 'robot',
                id: crypto.randomUUID()}
               ]);  

               

            }
            return(
                <div className="css-input-container">
                <input placeholder="Type your message..." 
                className="css-input"
                size="60" 
                onChange={saveInputText}
                value={inputText}
                onKeyDown={(event) => {
                    if(event.key === 'Enter'){
                        SendMessage();
                    }
                    else if(event.key === 'Escape'){
                        setInputText('');
                    }
                }}
                />
                <button
                 onClick={SendMessage}
                 className="css-send-button"
                >Send</button>
                </div>
            );
        }

        function ChatMessage({message, sender}){
       
            // const message = props.message; 
            // const sender = props.sender;

           /* if(sender === "robot"){
                return(
                    <div>
                        <img src="robot.png" width="50" />
                        {message}
                        </div>
                )
            }*/
            return (
            <div className={sender==='user' ? 'css-user-message' : 'css-robot-message'}>
                {sender==='robot' && <img src="robot.png"
                 className="css-message-icon"></img>}
            <div className="chat-message-text">
             {message}
            </div>
            { sender==='user' && <img src="user.png" className="css-message-icon"></img> }
            </div>
            );
        }

        function ChatMessages({chatMessages}){
            

          
            // const [chatMessages, setChatMessages] = array;

            // const chatMessages = array[0];
            // const setChatMessages = array[1];
             const chatMessageref = useAutoScroll([chatMessages]);
           
            return(
           <div className="css-chat-messages-container"
           ref={chatMessageref}>
          
          {chatMessages.map((chatMessage) => {
               return (
                 
                <ChatMessage message={chatMessage.message} sender={chatMessage.sender}
                key={chatMessage.id} />
               
             );
            })}
           
        </div>
    );
        }

        function App(){
            //lifted this state up
             const [chatMessages, setChatMessages]  =  React.useState([]);
          
            return(
           
              
            <div className="css-app-container">
                 {chatMessages.length === 0 && (
              <p className="welcome-message">
                Welcome to the chatbot project! Send a message using the textbox below.
              </p>
            )}
                
        <ChatMessages 
        chatMessages={chatMessages}
        />
         <ChatInput 
        chatMessages={chatMessages}
        setChatMessages={setChatMessages}
        />
        </div>
            );
        }
       

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
