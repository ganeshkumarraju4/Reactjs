<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
       
        function ChatInput(){
            return(
                <>
                <input placeholder="Type your message..." size="40"></input>
                <button>Send</button>
                </>
            );
        }

        function ChatMessage({message, sender}){
            // const message = props.message; 
            // const sender = props.sender;

           /* if(sender === "robot"){
                return(
                    <div>
                        <img src="robot.png" width="50" />
                        {message}
                        </div>
                )
            }*/
            return (
            <div>
                {sender==='robot' && <img src="robot.png" width="50"></img>}
            
             {message}
            { sender==='user' && <img src="user.png" width="50"></img> }
            </div>
            );
        }

        function ChatMessages(){
              const chatMessages = [
                {message: "hello chatbot", sender: "user",
                id:'id1'
                },
                {message: "How can i help you?", sender: "robot",
                    id:'id2'
                },
                {message: "I need help with my order", sender: "user", id:'id3'},
                
            ];
            return(
           <>
          {chatMessages.map((chatMessage) => {
               return (
                 
                <ChatMessage message={chatMessage.message} sender={chatMessage.sender}
                key={chatMessage.id} />
               
             );
            })}
           
        </>
    );
        }

        function App(){
          
            return(
              
            <>
        <ChatInput />
        <ChatMessages />
        </>
            );
        }
       

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
