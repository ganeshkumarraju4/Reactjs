<!DOCTYPE html>
<html>
  <head>
    <title>Login Form</title>
    <style>
        .css-header{
            font-size: 24px;
            font-family:Arial;
            margin-bottom: 20px;
        }
        .css-input{
            padding: 8px 5px ;
            margin-bottom: 10px;
            border-radius:5px;
            
        }
        .css-login-button{
            background-color: rgb(71, 144, 246);
            color:rgb(255, 255, 255);
            border-radius:5px;
            border: none;
            margin-right:8px;
            font-size: 16px;
            cursor:pointer;
            padding: 6px 10px;
        }
        .css-password{
            background-color: rgb(71, 144, 246);
            color:white;
            border-radius:5px;
            border: none;
            font-size: 14px;
            cursor:pointer;
            margin-left: 5px;
            padding: 8px 10px;
        }

    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

         function LoginForm(){
            const [showPassword,setshowPassword] = React.useState(false);
            return(
                <>
                <div>
                    <input placeholder="Enter your username"
                    className="css-input"
                    />
                </div>
                <div>
                    <input placeholder="Enter your password" type={showPassword ? 'text' : 'password'}
                    className="css-input"
                    />
                    <button 
                    onClick={() => setshowPassword(!showPassword)}
                    className="css-password"
                    >{showPassword ? 'Hide' : 'Show'}</button>
                </div>
                 <button className="css-login-button">Login</button>
                 <button className="css-login-button">Sign up</button>
                </>
            );
        }

       function App(){
        return(
            <>
           <p className="css-header"> Hello React!</p>
          
           <LoginForm />
           
            </>
        );
       }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
