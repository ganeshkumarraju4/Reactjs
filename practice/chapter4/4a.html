<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>

    <style>
    .css-button-on{
    background-color: rgb(31, 168, 104);
    color:white;
    border-radius:5px;
    border: none;
    font-size: 16px;
    cursor:pointer;
    padding: 10px 20px;
    }

    .css-button-off{
    background-color: rgb(228, 39, 39);
    color:white;
    border-radius:5px;
    border: none;
    font-size: 16px;
    cursor:pointer;
    padding: 10px 20px;
    }

    </style>

  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function App(){
            const [isButtonOn, setIsButtonOn] = React.useState(true);
            return(
                <button className={isButtonOn ? 'css-button-on' : 'css-button-off'}
                onClick={() => setIsButtonOn(!isButtonOn)}>
                   
                {isButtonOn ? 'ON' : 'OFF'}</button>
            );
        }
       
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
